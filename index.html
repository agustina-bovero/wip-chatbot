<title>Bancor Assistant — Scenario simulator</title>
<style>
  :root{
    --stage-bg:#eef1f0;
    --stage-fg:#1c2624;
    --stage-muted:#5b6b68;
    --frame-shadow: 0 30px 60px -20px rgba(0,40,36,0.28), 0 0 0 1px rgba(0,40,36,0.06);

    --brand:#005f5a;
    --brand-700:#024a46;
    --brand-tint:#e6f0ef;
    --accent-orange:#ee622b;
    --text-primary:#333333;
    --text-secondary:#969696;
    --surface:#ffffff;
    --surface-minimal:#f6f6f6;
    --radius-sm:8px;
    --radius-pill:999px;
    --font-heading:"Segoe UI Semibold","Open Sans",Roboto,Arial,sans-serif;
    --font-body:"Segoe UI","Public Sans",Roboto,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --stage-bg:#0f1513; --stage-fg:#eef4f2; --stage-muted:#93a29f; }
  }
  :root[data-theme="dark"]{ --stage-bg:#0f1513; --stage-fg:#eef4f2; --stage-muted:#93a29f; }
  :root[data-theme="light"]{ --stage-bg:#eef1f0; --stage-fg:#1c2624; --stage-muted:#5b6b68; }

  *{ box-sizing:border-box; }
  body{ margin:0; }
  .stage{ min-height:100%; background:var(--stage-bg); color:var(--stage-fg); font-family:var(--font-body); padding:28px 20px 64px; }
  .stage-head{ max-width:1100px; margin:0 auto 24px; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:700;
    letter-spacing:0.08em; text-transform:uppercase; color:var(--brand);
    background:color-mix(in srgb, var(--brand) 12%, transparent);
    padding:5px 12px; border-radius:var(--radius-pill); margin-bottom:14px;
  }
  @media (prefers-color-scheme:dark){ .eyebrow{ color:#7fd9d0; } }
  :root[data-theme="dark"] .eyebrow{ color:#7fd9d0; }
  .stage-head h1{ font-family:var(--font-heading); font-size:clamp(22px,3.4vw,30px); font-weight:700; margin:0 0 8px; text-wrap:balance; letter-spacing:-0.01em; }
  .stage-head p{ margin:0; max-width:66ch; color:var(--stage-muted); font-size:15px; line-height:1.55; }

  .wip-note{
    max-width:1100px; margin:24px auto 0;
    display:flex; align-items:center; justify-content:center; gap:9px;
    flex-wrap:wrap; text-align:center;
    font-size:12.5px; color:var(--stage-muted);
  }
  .wip-badge{
    display:inline-flex; align-items:center; gap:6px; flex-shrink:0;
    border:1.5px dashed var(--accent-orange); color:var(--accent-orange);
    padding:4px 11px; border-radius:var(--radius-pill);
    font-weight:700; font-size:11px; letter-spacing:.04em; text-transform:uppercase;
  }

  .demo-shell{ max-width:1100px; margin:0 auto; display:grid; grid-template-columns:300px 1fr; gap:32px; align-items:start; }

  /* ---- Scenario picker (left column) ---- */
  .scenario-panel{ display:flex; flex-direction:column; gap:14px; }
  .scenario-panel-title{ font-family:var(--font-heading); font-weight:700; font-size:12px; color:var(--stage-muted); margin:0; text-transform:uppercase; letter-spacing:.06em; }
  #scenarioList{ display:flex; flex-direction:column; gap:8px; }
  .scenario-btn{
    display:flex; gap:10px; align-items:flex-start; text-align:left; width:100%; margin:0;
    border:1.5px solid color-mix(in srgb, var(--stage-fg) 12%, transparent);
    background:var(--surface); border-radius:12px; padding:12px 14px; cursor:pointer;
    font-family:var(--font-body); transition:border-color .15s ease, background .15s ease;
  }
  .scenario-btn:hover{ border-color:var(--brand); }
  .scenario-btn.active{ border-color:var(--brand); background:var(--brand-tint); }
  .scenario-btn .sc-icon{ font-size:18px; line-height:1.1; flex-shrink:0; }
  .scenario-btn b{ display:block; font-size:13.5px; color:var(--text-primary); margin-bottom:2px; }
  .scenario-btn small{ display:block; font-size:11.5px; color:var(--text-secondary); line-height:1.4; }
  .scenario-btn:focus-visible{ outline:2px solid var(--accent-orange); outline-offset:2px; }

  /* ---- Chat shell (right column, standalone, no page behind it) ---- */
  .chat-shell-wrap{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  .chat-shell{
    width:min(440px, 100%); height:min(680px, 80vh);
    background:var(--surface); border-radius:22px; box-shadow:var(--frame-shadow);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .scenario-caption{ font-size:12.5px; color:var(--stage-muted); }
  .scenario-caption b{ color:var(--stage-fg); }

  .chat-header{ background:var(--brand); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .chat-avatar{ width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.18); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .chat-header-text{ flex:1; min-width:0; }
  .chat-header-text b{ display:block; font-size:14px; }
  .chat-header-text .status{ font-size:11.5px; opacity:0.85; display:flex; align-items:center; gap:5px; }
  .status-dot{ width:6px; height:6px; border-radius:50%; background:#5fe0a0; display:inline-block; }

  .lang-toggle{ display:flex; background:rgba(255,255,255,0.16); border-radius:var(--radius-pill); padding:2px; gap:2px; flex-shrink:0; }
  .lang-toggle button{ border:none; background:none; color:#fff; font-size:11px; font-weight:700; padding:5px 9px; border-radius:var(--radius-pill); cursor:pointer; opacity:.75; font-family:var(--font-body); }
  .lang-toggle button.active{ background:#fff; color:var(--brand); opacity:1; }
  .lang-toggle button:focus-visible{ outline:2px solid #fff; outline-offset:2px; }

  .chat-reset{ background:none; border:none; color:#fff; opacity:0.85; cursor:pointer; padding:5px; border-radius:6px; flex-shrink:0; }
  .chat-reset:hover{ opacity:1; background:rgba(255,255,255,0.14); }
  .chat-reset:focus-visible{ outline:2px solid #fff; outline-offset:2px; }

  .chat-messages{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; background:var(--surface-minimal); }
  .msg-row{ display:flex; gap:8px; max-width:88%; }
  .msg-row.user{ align-self:flex-end; flex-direction:row-reverse; }
  .msg-row.info{ align-self:center; max-width:96%; }
  .msg-avatar{ width:24px; height:24px; border-radius:50%; background:var(--brand); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px; }
  .bubble{ padding:10px 13px; border-radius:14px; font-size:13.5px; line-height:1.45; }
  .msg-row.bot .bubble{ background:var(--surface); color:var(--text-primary); border:1px solid #eaeaea; border-top-left-radius:4px; }
  .msg-row.user .bubble{ background:var(--brand); color:#fff; border-top-right-radius:4px; }
  .info-pill{ display:block; background:#eef6f5; color:var(--brand); font-size:11px; font-weight:700; padding:6px 12px; border-radius:var(--radius-pill); text-align:center; }

  .typing{ display:flex; gap:4px; padding:6px 4px; }
  .typing span{ width:6px; height:6px; border-radius:50%; background:var(--text-secondary); animation:bounce 1.2s infinite ease-in-out; }
  .typing span:nth-child(2){ animation-delay:.15s; }
  .typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{ 0%,60%,100%{ transform:translateY(0); opacity:.5; } 30%{ transform:translateY(-4px); opacity:1; } }
  @media (prefers-reduced-motion: reduce){ .typing span{ animation:none; opacity:.8; } }

  .stars{ display:flex; gap:5px; }
  .star{ font-size:21px; line-height:1; background:none; border:none; color:#d9d9d9; cursor:pointer; padding:0; }
  .star.filled{ color:var(--accent-orange); }
  .star:disabled{ cursor:default; }
  .star:focus-visible{ outline:2px solid var(--accent-orange); outline-offset:2px; }

  .quick-replies{ display:flex; flex-wrap:wrap; gap:8px; padding:0 16px 12px; background:var(--surface-minimal); flex-shrink:0; }
  .quick-reply{
    border:1.5px solid var(--brand); color:var(--brand); background:var(--surface); border-radius:var(--radius-pill);
    padding:7px 13px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:var(--font-body);
    transition:background .15s ease, color .15s ease;
  }
  .quick-reply:hover{ background:var(--brand); color:#fff; }
  .quick-reply.ghost{ border-style:dashed; }
  .quick-reply:focus-visible{ outline:2px solid var(--accent-orange); outline-offset:2px; }

  .chat-input-row{ display:flex; align-items:center; gap:8px; padding:12px; background:var(--surface); border-top:1px solid #eee; flex-shrink:0; }
  .chat-input-row input{ flex:1; border:1px solid #dcdcdc; border-radius:var(--radius-pill); padding:10px 14px; font-size:13px; font-family:var(--font-body); color:var(--text-primary); outline:none; }
  .chat-input-row input:focus{ border-color:var(--brand); }
  .chat-send{ width:38px; height:38px; border-radius:50%; border:none; background:var(--brand); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .chat-send:hover{ background:var(--brand-700); }
  .chat-send:disabled{ opacity:0.5; cursor:default; }
  .chat-send:focus-visible{ outline:2px solid var(--accent-orange); outline-offset:2px; }

  @media (max-width: 780px){
    .demo-shell{ grid-template-columns:1fr; justify-items:center; }
    .scenario-panel{ width:100%; max-width:440px; }
  }
</style>

<div class="stage">
  <div class="stage-head">
    <span class="eyebrow" id="txtEyebrow">Evolving proposal · Scenario simulator</span>
  </div>

  <div class="demo-shell">
    <aside class="scenario-panel">
      <p class="scenario-panel-title">Scenarios to show</p>
      <div id="scenarioList"></div>
    </aside>

    <div class="chat-shell-wrap">
      <div class="chat-shell" role="dialog" aria-label="Bancor virtual assistant" id="chatShell">
        <div class="chat-header">
          <div class="chat-avatar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="5" y="8" width="14" height="10" rx="3"/><path d="M9 8V6a3 3 0 016 0v2"/><circle cx="9.5" cy="13" r="1" fill="#fff" stroke="none"/><circle cx="14.5" cy="13" r="1" fill="#fff" stroke="none"/></svg>
          </div>
          <div class="chat-header-text">
            <b id="txtBotName">Bancor Assistant</b>
            <span class="status"><span class="status-dot"></span><span id="txtStatus">Online</span></span>
          </div>
          <div class="lang-toggle" id="langToggle" role="group" aria-label="Conversation language">
            <button data-lang="es">ES</button>
            <button data-lang="en" class="active">EN</button>
          </div>
          <button class="chat-reset" id="chatResetBtn" aria-label="Restart conversation" title="Restart conversation">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
          </button>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="quick-replies" id="quickReplies"></div>
        <div class="chat-input-row">
          <input type="text" id="chatInput" placeholder="Type your question..." autocomplete="off" />
          <button class="chat-send" id="chatSendBtn" aria-label="Send" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
      <div class="scenario-caption">Showing: <b id="scenarioCaptionText">Normal conversation</b></div>
    </div>
  </div>

  <p class="wip-note"><span class="wip-badge">🚧 WIP</span> <span id="txtWip">First proposal — design in progress, not a finished product.</span></p>
</div>

<script>

    en:{

      stolenCardAnswer:'To report a stolen card, block it instantly from Home Banking → Cards → Block, or call 0800-555-2626 (24/7).',
      csatQuestion:'How would you rate this service?',
      csatThanks:'Thanks for your rating! 🙌 It helps us improve our service.',
      backHome:'🏠 Back to home',
      replay:'🔁 Replay this scenario',
      keepChatting:'💬 Keep chatting freely',
      menu:[
        {label:'💳 Cards', key:'tarjetas'},
        {label:'🏦 Accounts', key:'cuentas'},
        {label:'💰 Loans', key:'prestamos'},
        {label:'📅 Appointments & branches', key:'turnos'},
        {label:'📋 Complaints', key:'reclamos'},
        {label:'🔐 Security', key:'seguridad'},
        {label:'🧑‍💼 Talk to an advisor', key:'asesor'}
      ],
      topics:{
        tarjetas:{ intro:'Pick an option about Cards, or tell me in your own words what you need:', options:[
          {label:'Block a card', text:'You can block your card instantly from Home Banking → Cards → Block, or by calling 0800-555-2626, available 24/7.'},
          {label:'Limits & spending', text:'Check your current limits and spending in Home Banking → Cards → Details. They update monthly based on your profile.'},

        ]},
        cuentas:{ intro:'What do you need to know about your account?', options:[
          {label:'Check balance', text:'Your available balance is in Home Banking → Home, or by dialing *123 from your registered phone.'},
          {label:'Transfers', text:'You can transfer for free between your own accounts and to other banks via CBU/alias from Home Banking → Transfers.'},

        ]},
        prestamos:{ intro:'I can help you with these loan-related questions:', options:[
          {label:'Simulate a loan', text:'Simulate installments and terms at bancor.com.ar/prestamos/simulador — no need to be a customer.'},
          {label:'Application status', text:'Your application status is updated in Home Banking → Loans → My applications, within 24 to 48 business hours.'},
          {label:'Requirements', text:'For personal loans you need: national ID, latest pay slip or tax return, and at least 6 months of employment history.'}
        ]},
        turnos:{ intro:'Here are the available options for appointments and branches:', options:[

        ]},
        reclamos:{ intro:"Tell me what you'd like to complain about:", options:[
          {label:"A charge I don't recognize", text:'Start the complaint from Home Banking → Cards → Dispute a charge. Response time is up to 10 business days.'},
          {label:'Branch service', text:'Leave your complaint about branch service at bancor.com.ar/contacto → Complaints, or by calling 0800-555-2626.'},
          {label:'Track a complaint', text:'Track your complaint status with your case number in Home Banking → Complaints → My cases.'}
        ]},
        seguridad:{ intro:'What do you need to know about security?', options:[
          {label:'Report fraud', text:'If you suspect fraud, call 0800-555-2626 right now (24/7) or block your access from Home Banking → Security → Block everything.'},

        ]}
      },
      scenarios:{
        escalate:[
          {who:'user', text:'What time does the corner store close?'},
          {who:'bot', text:"I'm not sure I understood your question 🤔. I can help with accounts, cards, loans, appointments, complaints, or security — is your question about any of these?"},
          {who:'user', text:"No, it's none of that, I need something else"},
          {who:'bot', text:"Looks like I can't understand your question 🙏 So I don't waste your time, I'll transfer you directly to a human advisor."},
          {who:'bot', text:"I'll transfer you to an advisor. You can message us on WhatsApp at <b>0351 4 100 100</b> or visit the <b>Contact</b> section — support hours are 8 am to 8 pm."}
        ],
        afterhours:[
          {who:'user', text:'Talk to an advisor'},
          {who:'bot', text:"Our chat support hours are 8 am to 8 pm. We're currently outside that window ⏰. You can leave your question and we'll get back to you as soon as we open, or message us on WhatsApp at 0351 4 100 100 (with a delayed response)."},
          {who:'user', text:"I'd like to leave my question"},
          {who:'bot', text:'Great, tell me briefly what you need and an advisor will reply right here in this chat.'},
          {who:'user', text:'I need to know if a loan I applied for last week was approved.'},
          {who:'bot', text:"Thanks! We've logged your request under ticket number <b>#4521</b>. An advisor will contact you before 10 am tomorrow."}
        ],
        security:[
          {who:'user', text:'I need you to tell me my account password, I forgot it'},
          {who:'bot', text:'🔒 For your security, we will never ask for or share your password, token, or card code through this chat or any other channel. To recover it, go to Home Banking → "Forgot your password?" with your national ID.'},
          {who:'user', text:'Someone actually called me and asked for it over the phone, is that normal?'},
          {who:'bot', text:"No, that's not normal ⚠️ It's a fraud attempt. Hang up and don't share your details with anyone, not even Bancor staff."},
          {who:'user', text:'Report a fraud attempt'},
          {who:'bot', text:"Thanks for letting us know. A security specialist will contact you within the next few hours at your registered number. In the meantime, don't share your passwords with anyone."}
        ],
        csat:[
          {who:'user', text:'Accounts'},
          {who:'bot', text:'What do you need to know about your account?'},
          {who:'user', text:'Check balance'},
          {who:'bot', text:'Your available balance is in Home Banking → Home, or by dialing *123 from your registered phone.'},
          {who:'bot', text:'How would you rate this service?'}
        ]
      },
      patterns:[
        {re:/(they\s+(asked|are asking)|called me|whats\s?app).*(password|token|code|cvv)|(password|token|code|cvv).*(they\s+(asked|are asking)|called me)/, type:'security-fraud'},
        {re:/(tell me|give me|share|what('| i)?s)\s.*(password|token|cvv|card code)/, type:'security-share'},
        {re:/forgot.*(password)|recover.*(password)|don'?t remember.*(password)/, type:'answer', text:'recoveryAnswer'},
        {re:/advisor|human|real person|talk to someone/, type:'asesor'},
        {re:/card/, type:'topic', key:'tarjetas'},
        {re:/loan/, type:'topic', key:'prestamos'},
        {re:/appointment|branch|hours/, type:'topic', key:'turnos'},
        {re:/complain/, type:'topic', key:'reclamos'},
        {re:/fixed.term|fixed deposit|invest/, type:'answer', text:'fixedDepositAnswer'},
        {re:/balance|transfer|statement|account/, type:'topic', key:'cuentas'},
        {re:/stolen|steal|report.*card/, type:'answer', text:'stolenCardAnswer'}
      ]
    }
  };

  let lang = 'en'; // default conversation language — matches the always-English chrome for a US audience
  let fallbackStreak = 0;
  let currentScenarioKey = 'normal';
  let runId = 0; // bumped every time a scenario (re)starts, invalidates in-flight timeouts from the previous one

  const messagesEl = document.getElementById('chatMessages');
  const quickRepliesEl = document.getElementById('quickReplies');
  const input = document.getElementById('chatInput');
  const sendBtn = document.getElementById('chatSendBtn');
  const resetBtn = document.getElementById('chatResetBtn');
  const captionEl = document.getElementById('scenarioCaptionText');
  const scenarioListEl = document.getElementById('scenarioList');
  const chatShellEl = document.getElementById('chatShell');

  const BOT_AVATAR = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="5" y="8" width="14" height="10" rx="3"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>';

  function tr(){ return T[lang]; }

  /* ---------------- Chrome render (fixed English, set once) ---------------- */
  function renderChrome(){
    document.title = CHROME.pageTitle;
    document.getElementById('txtEyebrow').textContent = CHROME.eyebrow;
    document.getElementById('txtWip').textContent = CHROME.wip;
    document.getElementById('txtBotName').textContent = CHROME.botName;
    document.getElementById('txtStatus').textContent = CHROME.status;
    resetBtn.setAttribute('aria-label', CHROME.resetLabel);
    resetBtn.setAttribute('title', CHROME.resetLabel);
    chatShellEl.setAttribute('aria-label', CHROME.dialogLabel);
    input.setAttribute('placeholder', CHROME.inputPlaceholder);
    sendBtn.setAttribute('aria-label', CHROME.sendLabel);
    document.documentElement.lang = 'en';
  }

  // Scenario picker is rendered once — it's the presenter's tool, always in English (see SCENARIO_META above).
  function renderScenarioList(){
    const keys = ['normal','escalate','afterhours','security','csat'];
    scenarioListEl.innerHTML = keys.map(key => {
      const m = SCENARIO_META[key];
      return '<button class="scenario-btn' + (key === currentScenarioKey ? ' active' : '') + '" data-key="' + key + '">' +
        '<span class="sc-icon">' + m.icon + '</span>' +
        '<span><b>' + m.title + '</b><small>' + m.desc + '</small></span></button>';
    }).join('');
    scenarioListEl.querySelectorAll('.scenario-btn').forEach(btn => {
      btn.addEventListener('click', () => runScenario(btn.dataset.key));
    });
  }

  /* ---------------- Chat rendering helpers ---------------- */
  function scrollToBottom(){ messagesEl.scrollTop = messagesEl.scrollHeight; }

  function addMessage(sender, html){
    const row = document.createElement('div');
    row.className = 'msg-row ' + sender;
    if(sender === 'bot'){
      row.innerHTML = '<span class="msg-avatar">'+BOT_AVATAR+'</span><span class="bubble">'+html+'</span>';
    } else if(sender === 'info'){
      row.innerHTML = '<span class="info-pill">'+html+'</span>';
    } else {
      row.innerHTML = '<span class="bubble">'+html+'</span>';
    }
    messagesEl.appendChild(row);
    scrollToBottom();
    return row;
  }

  function showTyping(cb, myRun){
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = '<span class="msg-avatar">'+BOT_AVATAR+'</span><span class="bubble typing"><span></span><span></span><span></span></span>';
    messagesEl.appendChild(row);
    scrollToBottom();
    setTimeout(() => {
      row.remove();
      if(myRun !== undefined && myRun !== runId) return; // a newer scenario/language switch started meanwhile — drop this callback
      cb();
    }, 650 + Math.random()*400);
  }

  function setQuickReplies(list){
    quickRepliesEl.innerHTML = '';
    list.forEach(item => {
      const btn = document.createElement('button');
      btn.className = 'quick-reply' + (item.ghost ? ' ghost' : '');
      btn.textContent = item.label;
      btn.addEventListener('click', () => item.action ? handleAction(item) : handleChoice(item));
      quickRepliesEl.appendChild(btn);
    });
  }

  function addStarRating(){
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = '<span class="msg-avatar">'+BOT_AVATAR+'</span><span class="bubble"><div class="stars">'+
      [1,2,3,4,5].map(n => '<button class="star" data-n="'+n+'">★</button>').join('') + '</div></span>';
    messagesEl.appendChild(row);
    scrollToBottom();
    row.querySelectorAll('.star').forEach(btn => {
      btn.addEventListener('click', () => {
        const n = +btn.dataset.n;
        const stars = row.querySelectorAll('.star');
        stars.forEach((s, idx) => { s.classList.toggle('filled', idx < n); s.disabled = true; });
        setTimeout(() => {
          addMessage('bot', tr().csatThanks);
          setQuickReplies([{label:tr().backHome, action:'normal'}]);
        }, 350);
      });
    });
  }

  /* ---------------- Conversation logic ---------------- */
  function showMenu(withGreeting){
    fallbackStreak = 0;
    addMessage('bot', withGreeting ? tr().greeting : tr().moreHelp);
    setQuickReplies(tr().menu);
  }

  function showTopic(key){
    fallbackStreak = 0;
    const topic = tr().topics[key];
    addMessage('bot', topic.intro);
    const opts = topic.options.map(o => ({label:o.label, text:o.text}));
    opts.push({label:tr().backToMenu, key:'menu', ghost:true});
    setQuickReplies(opts);
  }

  function handoffAsesor(){
    fallbackStreak = 0;
    addMessage('bot', tr().handoff);
    setQuickReplies([{label:tr().backToMenu, key:'menu', ghost:true}]);
  }

  function handleChoice(item){
    const myRun = runId;
    addMessage('user', item.label.replace(/^[^\w¡¿]+/, '').trim());
    setQuickReplies([]);
    showTyping(() => {
      if(item.key === 'menu') return showMenu(false);
      if(item.key === 'asesor') return handoffAsesor();
      if(item.key && tr().topics[item.key]) return showTopic(item.key);
      if(item.text){
        fallbackStreak = 0;
        addMessage('bot', item.text + '<br><br>' + tr().helpfulQuestion);
        setQuickReplies([
          {label:tr().yesThanks, key:'menu'},
          {label:tr().talkAdvisor, key:'asesor'},
          {label:tr().backToMenu, key:'menu', ghost:true}
        ]);
      }
    }, myRun);
  }

  function handleAction(item){
    if(item.action === 'repeat') return runScenario(currentScenarioKey);
    if(item.action === 'normal') return runScenario('normal');
    const myRun = runId;
    addMessage('user', item.label.replace(/^[^\w¡¿]+/, '').trim());
    setQuickReplies([]);
    showTyping(() => {
      if(item.action === 'continue') return showMenu(false);
      if(item.action.startsWith('topic:')) return showTopic(item.action.split(':')[1]);
    }, myRun);
  }

  function matchFreeText(text){
    const t = text.toLowerCase();
    for(const p of tr().patterns){
      if(p.re.test(t)){
        if(p.type === 'answer') return {type:'answer', text:tr()[p.text]};
        if(p.type === 'topic') return {type:'topic', key:p.key};
        return {type:p.type};
      }
    }
    return null;
  }

  function handleFreeText(text){
    const myRun = runId;
    addMessage('user', text.replace(/</g,'&lt;'));
    setQuickReplies([]);
    input.value = '';
    sendBtn.disabled = true;
    showTyping(() => {
      const match = matchFreeText(text);

      if(!match){
        fallbackStreak++;
        if(fallbackStreak >= 2){
          fallbackStreak = 0;
          addMessage('bot', tr().fallbackEscalate);
          setTimeout(() => { if(myRun === runId) handoffAsesor(); }, 50);
          return;
        }
        addMessage('bot', tr().fallback1);
        setQuickReplies(tr().menu);
        return;
      }

      fallbackStreak = 0;
      if(match.type === 'asesor') return handoffAsesor();
      if(match.type === 'topic') return showTopic(match.key);
      if(match.type === 'security-fraud'){
        addMessage('bot', tr().securityFraud);
        setQuickReplies([{label:tr().reportFraud, action:'topic:seguridad'}, {label:tr().backToMenu, key:'menu', ghost:true}]);
        return;
      }
      if(match.type === 'security-share'){
        addMessage('bot', tr().securityShare);
        setQuickReplies([{label:tr().moreSecurity, action:'topic:seguridad'}, {label:tr().backToMenu, key:'menu', ghost:true}]);
        return;
      }
      if(match.type === 'answer'){
        addMessage('bot', match.text + '<br><br>' + tr().helpfulQuestion);
        setQuickReplies([
          {label:tr().yesThanks, key:'menu'},
          {label:tr().talkAdvisor, key:'asesor'},
          {label:tr().backToMenu, key:'menu', ghost:true}
        ]);
      }
    }, myRun);
  }

  /* ---------------- Scripted demo scenarios ---------------- */
  const SCENARIO_AFTER = {
    escalate:() => setQuickReplies([{label:tr().replay, action:'repeat'}, {label:tr().keepChatting, action:'continue'}]),
    afterhours:() => setQuickReplies([{label:tr().replay, action:'repeat'}, {label:tr().keepChatting, action:'continue'}]),
    security:() => setQuickReplies([{label:tr().replay, action:'repeat'}, {label:tr().moreSecurity, action:'topic:seguridad'}]),
    csat:() => addStarRating()
  };

  function playSteps(steps, i, done, myRun){
    if(myRun !== runId) return; // superseded by a newer scenario/language switch
    if(i >= steps.length){ done && done(); return; }
    const step = steps[i];
    if(step.who === 'user'){
      setTimeout(() => {
        if(myRun !== runId) return;
        addMessage('user', step.text);
        playSteps(steps, i+1, done, myRun);
      }, 550);
    } else {
      showTyping(() => { addMessage('bot', step.text); playSteps(steps, i+1, done, myRun); }, myRun);
    }
  }

  function clearChat(){ messagesEl.innerHTML = ''; quickRepliesEl.innerHTML = ''; fallbackStreak = 0; }

  function runScenario(key){
    const myRun = ++runId; // invalidates any in-flight timeouts from whatever was running before
    currentScenarioKey = key;
    clearChat();
    document.querySelectorAll('.scenario-btn').forEach(b => b.classList.toggle('active', b.dataset.key === key));
    captionEl.textContent = SCENARIO_META[key].title;
    addMessage('info', tr().disclaimer);
    if(key === 'normal'){ showMenu(true); return; }
    playSteps(tr().scenarios[key], 0, SCENARIO_AFTER[key], myRun);
  }

  /* ---------------- Wiring ---------------- */
  document.getElementById('langToggle').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-lang]');
    if(!btn || btn.classList.contains('active')) return;
    lang = btn.dataset.lang;
    document.querySelectorAll('#langToggle button').forEach(b => b.classList.toggle('active', b === btn));
    runScenario(currentScenarioKey); // only the conversation replays in the new language — chrome stays English
  });

  resetBtn.addEventListener('click', () => runScenario(currentScenarioKey));

  input.addEventListener('input', () => { sendBtn.disabled = input.value.trim().length === 0; });
  input.addEventListener('keydown', (e) => { if(e.key === 'Enter' && input.value.trim()) handleFreeText(input.value.trim()); });
  sendBtn.addEventListener('click', () => { if(input.value.trim()) handleFreeText(input.value.trim()); });

  renderChrome();
  renderScenarioList();
  runScenario('normal');
})();
</script>
